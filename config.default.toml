# Konfigurasi Default CooperAgent (Grok Build) untuk Tim Internal AI (256K Dedicated Context)
# Simpan file ini di: ~/.grok/config.toml (Linux/Mac) atau %USERPROFILE%\.grok\config.toml (Windows)

[cli]
auto_update = false

[features]
telemetry = false

[session]
# Compaction NATIVE Grok sebagai jaring pengaman. 85% x 131.072 = 111.411 token;
# +max_tokens 12.288 = 123.699, di bawah plafon slot 172.032.
# CATATAN FASE 1: 137.626 sengaja di ATAS 128.000 agar sampel context 128-160K
# muncul dan tebing kinerja bisa diukur. Bila terbukti runtuh, turunkan ke 74%.
# Jalur utama tetap handover di batas tugas (lihat AGENTS.md §Protokol Sesi).
auto_compact_threshold_percent = 85
load_envrc = true

[models]
default = "internal-qwen"
stream_tool_calls = true
temperature = 1.0
top_p = 0.95
min_p = 0.0
repeat_penalty = 1.0
max_completion_tokens = 12288
max_tokens = 12288
max_output_tokens = 12288

# Konfigurasi Model Utama Qwen 27B melalui Central Gateway Port 8987 (CooperxCompute)
[model.internal-qwen]
model = "qwen35"
base_url = "http://192.168.2.143:8987/api/v1"
name = "CooperAgent Qwen 3.8 / 2.5 (27B Q8 - 256K Dedicated)"
description = "Dedicated 256K Monster Context Window via Port 8987 Gateway"
api_backend = "chat_completions"
context_window = 131072
max_completion_tokens = 12288
max_tokens = 12288
max_output_tokens = 12288
temperature = 1.0
top_p = 0.95
min_p = 0.0
repeat_penalty = 1.0
presence_penalty = 0.0
api_key = "dev-user"

# Fallback / Localhost (jika dijalankan langsung di server AI)
[model.internal-qwen-localhost]
model = "qwen35"
base_url = "http://127.0.0.1:8987/api/v1"
name = "Localhost CooperAgent (Direct Server Gateway)"
api_backend = "chat_completions"
context_window = 131072
max_completion_tokens = 12288
max_tokens = 12288
max_output_tokens = 12288
temperature = 1.0
top_p = 0.95
min_p = 0.0
repeat_penalty = 1.0
presence_penalty = 0.0
api_key = "dev-localhost"

# Memory native Grok. DEFAULT-nya false, jadi harus dinyalakan eksplisit.
# Ini yang membuat agent tetap mengingat inti sesi sebelumnya setelah /clear:
# memory dicari otomatis pada giliran pertama tiap sesi dan setelah compaction.
# Pakai /flush di batas tugas untuk menulis ringkasan sesi yang dapat dicari.
# Catatan: isinya tersimpan di ~/.grok/memory/ -> LOKAL per mesin, tidak terbagi.
[memory]
enabled = true
