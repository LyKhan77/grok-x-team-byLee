# Konfigurasi Default Grok Build untuk Tim Internal AI (256K Context & Hybrid Sampling)
# Simpan file ini di: ~/.grok/config.toml

[cli]
auto_update = false

[features]
telemetry = false

[models]
default = "qwen38-local"
stream_tool_calls = true
temperature = 0.7
top_p = 0.85
min_p = 0.05
repeat_penalty = 1.1
max_completion_tokens = 65536
max_tokens = 65536
max_output_tokens = 65536

# Konfigurasi Model Utama Qwen 27B di Llama-Server Internal
[model.qwen38-local]
model = "qwen35"
base_url = "http://192.168.2.143:8001/v1"
name = "Internal Qwen 3.8 / 2.5 (27B Q8 - 256K Hybrid)"
description = "High-precision hybrid sampling for deep reasoning and complex coding"
api_backend = "chat_completions"
context_window = 262144
max_completion_tokens = 65536
max_tokens = 65536
max_output_tokens = 65536
temperature = 0.7
top_p = 0.85
min_p = 0.05
repeat_penalty = 1.1
presence_penalty = 0.1
api_key = "sk-internal-team"

# Fallback / Localhost (jika dijalankan langsung di server)
[model.qwen38-localhost]
model = "qwen35"
base_url = "http://127.0.0.1:8001/v1"
name = "Localhost Qwen (Direct Server)"
api_backend = "chat_completions"
context_window = 262144
max_completion_tokens = 65536
max_tokens = 65536
max_output_tokens = 65536
temperature = 0.7
top_p = 0.85
min_p = 0.05
repeat_penalty = 1.1
presence_penalty = 0.1
api_key = "sk-internal-team"
