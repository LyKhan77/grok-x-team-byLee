[Unit]
# Crashloop berhenti setelah 3 kegagalan dalam 10 menit, bukan menggilas GPU
# tanpa batas. Interval lama (10s) mustahil tercapai karena load butuh ~40s.
StartLimitIntervalSec=600
StartLimitBurst=3

[Service]
# Validasi config sebelum GPU disentuh
ExecStartPre=/home/gspe-ai1/project/gspexgrok-agent/scripts/llamacpp-preflight.sh

# Beri waktu shutdown bersih; llama-server melepas VRAM saat SIGTERM
TimeoutStopSec=120

# CUDA_VISIBLE_DEVICES sengaja TIDAK diset di sini.
# run-qwen.sh menetapkannya inline (0,1,2) dan itulah satu-satunya sumber kebenaran.
